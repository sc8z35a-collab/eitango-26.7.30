<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAF8F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101317" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="description" content="共通テスト型の長文3本・全10問（小問22）とプロによる文法・語彙解説を収録した対策キット。学習データは本編と完全独立。">
<meta name="color-scheme" content="light dark">
<title>共通テスト対策キット — Glass Vocab</title>
<link rel="stylesheet" href="css/exam.css">
</head>
<body>

<!-- 背景（紙の目） -->
<div id="bg" aria-hidden="true"></div>

<div id="frame">

  <!-- ============ 未購入時のロック画面 ============ -->
  <section id="lockView" hidden aria-label="共通テスト対策キットの案内"></section>

  <!-- ============ 本体 ============ -->
  <div id="shell" hidden>

    <header id="bar">
      <div class="bar-row" id="barTop"></div>
      <div id="barRail" hidden></div>
    </header>

    <main id="stage">
      <section class="view" id="v-top" aria-label="キットのトップ"></section>
      <section class="view" id="v-read" hidden aria-label="本文"></section>
      <section class="view" id="v-quiz" hidden aria-label="設問"></section>
      <section class="view" id="v-result" hidden aria-label="採点結果"></section>
      <section class="view" id="v-vocab" hidden aria-label="語彙シート"></section>
      <section class="view" id="v-gram" hidden aria-label="文法ポイント"></section>
    </main>

    <!-- 操作は常に画面下部（サムゾーン） -->
    <footer id="dock"></footer>
  </div>
</div>

<!-- 通知（情報は上部に出して下部の操作を覆わない） -->
<div id="toast" aria-live="polite" aria-atomic="false"></div>

<!-- 解説・設定シート（ネイティブ dialog） -->
<dialog class="sheet" id="sheet" aria-label="詳細">
  <div class="sheet-in">
    <button class="grab" id="sheetGrab" aria-label="とじる"></button>
    <div class="sheet-body" id="sheetBody"></div>
  </div>
</dialog>

<noscript>
  <p style="padding:24px;font-family:system-ui">この対策キットは JavaScript を有効にするとご利用いただけます。</p>
</noscript>

<script src="js/exam-data.js"></script>
<script src="js/exam-app.js"></script>
</body>
</html>
